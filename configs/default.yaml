# Every rule and vehicle below was fixed before results were examined.
out_dir: reports
prices: data/raw/stock_prices.parquet
dividends: data/raw/stock_dividend_events.parquet
treasury: data/raw/daily_treasury_yield.parquet
wti: data/raw/wti-daily.csv
henry_hub: data/raw/henry-hub-daily.csv
end: "2026-10-19"              # last common date across sources

# Vehicles: how each one holds futures (from each fund's prospectus description)
oil:
  spot: WTI
  start: "2008-01-01"          # first full month with all three oil funds
  vehicles:
    USO: "Front month (nearby WTI futures)"
    USL: "12-month strip (equal weight, next 12 WTI contracts)"
    DBO: "Optimum yield (contract with the best implied roll within 13 months)"
gas:
  spot: HH
  start: "2010-02-01"          # first full month with UNL
  vehicles:
    UNG: "Front month (nearby Henry Hub futures)"
    UNL: "12-month strip (equal weight, next 12 contracts)"
broad:
  start: "2010-09-01"          # first full month with USCI
  vehicles:
    GSG: "S&P GSCI: production-weighted, near contracts (energy-heavy)"
    DBC: "Optimum-yield diversified index (14 commodities)"
    USCI: "Backwardation-tilted selection (SummerHaven index)"
reference: [GLD, SPY]          # physical gold (no roll) and US equities, for context only

# Pre-specified switching rule (tested at all three lookbacks; all reported)
switch:
  front: USO
  deferred: USL
  lookbacks_months: [1, 3, 6]  # hold the front month next month only if its trailing realised roll gap was positive
  cost_bps_per_switch: 10
sleeve_usd: 100000000          # illustrative strategic commodity sleeve for the dollar translation

sources:
  stock_prices.parquet: {url: https://huggingface.co/datasets/defeatbeta/yahoo-finance-data/resolve/main/data/US/stock_prices.parquet, sha256: 903dbb965979f8b92a60b01524372f42be0e4bf88c291caf87171a286149be32}
  stock_dividend_events.parquet: {url: https://huggingface.co/datasets/defeatbeta/yahoo-finance-data/resolve/main/data/US/stock_dividend_events.parquet, sha256: 08d2a37482501c79c108dd4fefe5f1cd8d64b19ef3d3a316753597c0ddd4ece8}
  daily_treasury_yield.parquet: {url: https://huggingface.co/datasets/defeatbeta/yahoo-finance-data/resolve/main/data/US/daily_treasury_yield.parquet, sha256: 37fca5d22b8580efc93225213d0c4f6d7ef9cf5b183cf7a427cd22b274606171}
  wti-daily.csv: {url: https://raw.githubusercontent.com/datasets/oil-prices/main/data/wti-daily.csv, sha256: 59fa39e32b6d950c2aae364506b4899e2e5ecea6b2c2f95d4e69796f926639cd}
  henry-hub-daily.csv: {url: https://raw.githubusercontent.com/datasets/natural-gas/main/data/daily.csv, sha256: c00405c1d478dae3b9c9f7014d64723d14bb888ddfd0019e06361b2b4ab8df2d}
